<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KhataSetu – Digital Ledger App</title>
  <meta name="description" content="Track Udhaar, manage accounts, and grow your business faster.">

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){
    n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s);
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1977327726189132');
    fbq('track','PageView');
  </script>

  <!-- ADSENSE -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7094776728416254" crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>

    /* GLOBAL */
    body {
      margin:0;
      font-family:Poppins,sans-serif;
      background:#0D0D0D;
      color:#fff;
    }

    /* NAV */
    .nav {
      position:sticky;
      top:0;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(10px);
      padding:15px;
      z-index:1000;
    }
    .nav-container {
      max-width:1200px;
      margin:auto;
      display:flex;
      justify-content:space-between;
    }

    /* HERO */
    .hero {
      padding:80px 20px;
      background:linear-gradient(135deg,#1e293b,#0f172a);
    }

    /* SEARCH + TAGS */
    .controls {
      max-width:1200px;
      margin:20px auto;
    }
    input {
      padding:10px;
      width:100%;
      border-radius:8px;
      border:none;
      background:#1a1a1a;
      color:#fff;
    }
    .tags {
      margin-top:10px;
    }
    .tag {
      display:inline-block;
      padding:6px 12px;
      margin:5px;
      background:#111;
      border-radius:20px;
      cursor:pointer;
    }
    .tag.active {
      background:#2563eb;
    }

    /* MASONRY */
    .masonry {
      column-count:3;
      column-gap:15px;
      max-width:1200px;
      margin:auto;
    }
    @media(max-width:900px){.masonry{column-count:2}}
    @media(max-width:600px){.masonry{column-count:1}}

    .card {
      break-inside:avoid;
      margin-bottom:15px;
      border-radius:16px;
      overflow:hidden;
      background:#111;
    }
    .card img {
      width:100%;
      display:block;
    }

    /* ADS */
    .ad-box {
      width:100%;
      height:250px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* FOOTER */
    footer {
      text-align:center;
      padding:30px;
      background:#111;
    }

  </style>

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- HERO -->
<section class="hero">
  <h1 style="text-align:center;">Explore UI Screens</h1>
</section>

<!-- SEARCH + TAGS -->
<div class="controls">
  <input type="text" id="search" placeholder="Search UI...">

  <div class="tags">
    <span class="tag active" onclick="setTag('all')">All</span>
    <span class="tag" onclick="setTag('ledger')">Ledger</span>
    <span class="tag" onclick="setTag('reports')">Reports</span>
    <span class="tag" onclick="setTag('customers')">Customers</span>
  </div>
</div>

<!-- AD TOP -->
<div class="ad-box">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-7094776728416254"
       data-ad-slot="2562895484"
       data-ad-format="auto"></ins>
</div>

<!-- MASONRY -->
<div id="gallery" class="masonry"></div>

<div id="footer"></div>

<script>

  /* DATA */
  const data=[
  {img:"/1.jpg",tag:"ledger",title:"ledger"},
  {img:"/2.jpg",tag:"reports",title:"reports"},
  {img:"/3.jpg",tag:"customers",title:"customers"},
  {img:"/4.jpg",tag:"ledger",title:"ledger"},
  {img:"/5.jpg",tag:"reports",title:"reports"},
  {img:"/6.jpg",tag:"customers",title:"customers"}
  ];

  let index=0;
  let currentTag="all";
  let searchText="";

  const gallery=document.getElementById('gallery');

  /* CREATE CARD */
  function createCard(item){
  const div=document.createElement('div');
  div.className='card';

  div.innerHTML=`
  <a href="/blog/">
  <img src="${item.img}" loading="lazy">
  </a>
  `;
  return div;
  }

  /* FILTER */
  function match(item){
  return (currentTag==="all"||item.tag===currentTag) &&
  item.title.includes(searchText);
  }

  /* LOAD */
  function load(n=6){
  for(let i=0;i<n;i++){
  const item=data[index%data.length];

  if(match(item)){
  gallery.appendChild(createCard(item));
  }

  index++;
  }

  /* INSERT AD every 10 items */
  if(index%10===0){
  const ad=document.createElement('div');
  ad.className='ad-box';
  ad.innerHTML=`<ins class="adsbygoogle"
  style="display:block"
  data-ad-client="ca-pub-7094776728416254"
  data-ad-slot="2562895484"
  data-ad-format="auto"></ins>`;
  gallery.appendChild(ad);
  }
  }

  /* TAG */
  function setTag(tag){
  currentTag=tag;
  gallery.innerHTML='';
  index=0;

  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');

  load();
  }

  /* SEARCH */
  document.getElementById('search').addEventListener('input',e=>{
  searchText=e.target.value.toLowerCase();
  gallery.innerHTML='';
  index=0;
  load();
  });

  /* INIT */
  load();

  /* INFINITE SCROLL */
  window.addEventListener('scroll',()=>{
  if(window.innerHeight+window.scrollY>=document.body.offsetHeight-200){
  load(3);
  }
  });

</script>

</body>
</html>
